name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Money.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-release-apk
          path: build/app/outputs/flutter-apk/Money.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Money v1.0.0' }}
          body: |
            ## 💰 Money - Release Android

            Versão do aplicativo Money para Android com suporte a Firebase Firestore, autenticação Google, biometria e sincronização em tempo real.

            ### 📱 Download e Instalação
            1. Baixe o arquivo **Money.apk** abaixo.
            2. Abra o arquivo no seu smartphone Android para instalar.
          files: |
            build/app/outputs/flutter-apk/Money.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
